# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Playwright requires additional system packages to run Chromium.
  # https://playwright.dev/docs/ci#system-dependencies
  packages:
    - libglib2.0-0
    - libgobject-2.0-0
    - libnspr4
    - libnss3
    - libnssutil3
    - libdbus-1-3
    - libgio-2.0-0
    - libatk1.0-0
    - libatk-bridge2.0-0
    - libexpat1
    - libatspi2.0-0
    - libx11-6
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxrandr2
    - libgbm1
    - libxcb1
    - libxkbcommon0
    - libudev1
    - libasound2
    - libpangocairo-1.0-0
    - libpango-1.0-0
    - libcairo2
    - libharfbuzz0b
